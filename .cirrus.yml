task:
  name: Build unsigned IPA
  macos_instance:
    image: ghcr.io/cirruslabs/macos-runner:sonoma
  install_script:
    - brew install xcodegen
  build_script:
    - xcodegen generate
    - xcodebuild -project LedgerNative.xcodeproj -scheme LedgerNative -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build
    - APP="build/DerivedData/Build/Products/Release-iphoneos/LedgerNative.app"
    - test -d "$APP"
    - mkdir -p build/Payload
    - cp -R "$APP" build/Payload/
    - cd build && zip -qry LedgerNative-unsigned.ipa Payload
  ipa_artifacts:
    path: build/LedgerNative-unsigned.ipa
