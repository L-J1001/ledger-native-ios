name: Build iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'LedgerNative/**'
      - 'project.yml'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available Xcode
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project LedgerNative.xcodeproj \
            -scheme LedgerNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/LedgerNative.app"
          test -d "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry LedgerNative-unsigned.ipa Payload
          ls -lh LedgerNative-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerNative-unsigned-ipa
          path: build/LedgerNative-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
