name: Simulator smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project LedgerNative.xcodeproj \
            -scheme LedgerNative \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/Sim \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Launch and screenshot
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | sed -nE 's/.*iPhone.*\(([0-9A-F-]{36})\).*/\1/p' | head -1)
          test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Sim/Build/Products/Debug-iphonesimulator/LedgerNative.app
          xcrun simctl launch "$UDID" com.ll205.ledgernative
          sleep 3
          xcrun simctl io "$UDID" screenshot build/smoke.png
          ls -lh build/smoke.png
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke
          path: build/smoke.png
          if-no-files-found: error
