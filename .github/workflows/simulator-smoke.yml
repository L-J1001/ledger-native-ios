name: Simulator smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project LedgerNative.xcodeproj \
            -scheme LedgerNative \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build/Sim \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Launch and screenshot
        run: |
          set -euo pipefail
          xcrun simctl boot "iPhone 16" || true
          xcrun simctl bootstatus "iPhone 16" -b
          xcrun simctl install booted build/Sim/Build/Products/Debug-iphonesimulator/LedgerNative.app
          xcrun simctl launch booted com.ll205.ledgernative
          sleep 3
          xcrun simctl io booted screenshot build/smoke.png
          ls -lh build/smoke.png
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke
          path: build/smoke.png
          if-no-files-found: error
