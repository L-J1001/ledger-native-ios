name: LedgerNative
options:
  bundleIdPrefix: com.ll205
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.ll205.ledgernative
    MARKETING_VERSION: "1.9.0"
    CURRENT_PROJECT_VERSION: "50"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
targets:
  LedgerNative:
    type: application
    platform: iOS
    sources:
      - path: LedgerNative
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: LedgerNative
        INFOPLIST_FILE: LedgerNative/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  LedgerNative:
    build:
      targets:
        LedgerNative: all
    run:
      config: Debug
    archive:
      config: Release



